<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kubaman Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --sky:#2fb4ff; --sky2:#0a7fd6; --navy:#0b2a5b; --bg:#dff3ff; --panel:#ffffff;
  --ink:#16213a; --muted:#5a6b85; --line:#cfe3f5;
  --yellow:#ffd23f; --orange:#ff8a1f; --red:#ff4d5e; --green:#2ccf6a; --purple:#8b5cf6; --pink:#ff5fa8; --teal:#14c3b4;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
.sky{background:
  radial-gradient(circle at 12% 30%,rgba(255,255,255,.35) 0 2px,transparent 3px),
  radial-gradient(circle at 78% 20%,rgba(255,255,255,.35) 0 2px,transparent 3px),
  radial-gradient(circle at 55% 70%,rgba(255,255,255,.25) 0 2px,transparent 3px),
  radial-gradient(circle at 92% 75%,rgba(255,255,255,.3) 0 2px,transparent 3px),
  linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
  border-bottom:5px solid var(--navy)}
.sky .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px;
  text-shadow:0 3px 0 var(--navy),2px 3px 0 var(--navy),-2px 3px 0 var(--navy)}
.logo .w span{display:inline-block;transition:transform .2s}
.logo:hover .w span{transform:translateY(-3px) rotate(-4deg)}
.logo .w span:nth-child(5n+1){color:var(--yellow)}
.logo .w span:nth-child(5n+2){color:#fff}
.logo .w span:nth-child(5n+3){color:var(--green)}
.logo .w span:nth-child(5n+4){color:var(--pink)}
.logo .w span:nth-child(5n+5){color:var(--orange)}
.logo small{font-size:15px;color:#fff;text-shadow:0 2px 0 var(--navy);font-weight:700;opacity:.9}
.spacer{flex:1}
.search{width:240px;max-width:100%;border:3px solid var(--navy);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;color:var(--ink);background:#fff}
.search:focus{outline:3px solid var(--yellow)}
.rnd{font-family:var(--display);font-weight:800;font-size:17px;background:var(--yellow);color:var(--navy);border:3px solid var(--navy);border-radius:999px;padding:5px 16px;box-shadow:0 4px 0 var(--navy);transition:transform .1s,box-shadow .1s}
.rnd:hover{transform:translateY(-1px)}
.rnd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}

/* category bar */
.cats{background:var(--yellow);border-bottom:4px solid var(--navy)}
.cats .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cat{font-family:var(--display);font-weight:800;font-size:15px;color:var(--navy);padding:4px 14px;border-radius:999px;white-space:nowrap;border:3px solid transparent}
.cat:hover{background:rgba(255,255,255,.55)}
.cat.on{background:#fff;border-color:var(--navy)}

/* ---------- panels ---------- */
main.wrap{padding-top:18px;padding-bottom:48px}
.panel{background:var(--panel);border-radius:18px;border:3px solid var(--navy);box-shadow:0 6px 0 rgba(11,42,91,.18);margin-bottom:22px;overflow:hidden}
.ptitle{display:flex;align-items:center;gap:10px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ptitle .n{margin-left:auto;font-size:14px;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 10px}
.ptitle.c1{background:linear-gradient(90deg,#ff7a1a,#ffb11f)}
.ptitle.c2{background:linear-gradient(90deg,#22c55e,#14c3b4)}
.ptitle.c3{background:linear-gradient(90deg,#7c4dff,#2f8cff)}
.pbody{padding:16px}
.sub{margin:-4px 0 14px;color:var(--muted);font-weight:700;font-size:14px}
.prog{height:12px;border-radius:999px;background:#ffe9c7;border:2px solid var(--navy);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--orange) 0 10px,#ffa53d 10px 20px);transition:width .3s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}

/* ---------- game tile ---------- */
.tile{position:relative;display:block}
.tw{position:relative}
.thumb{position:relative;aspect-ratio:1/1;border-radius:16px;border:3px solid var(--navy);overflow:hidden;display:grid;place-items:center;
  box-shadow:0 5px 0 var(--navy);transition:transform .15s,box-shadow .15s}
.thumb::before{content:"";position:absolute;inset:0;opacity:.25;
  background:radial-gradient(circle,#fff 0 3px,transparent 4px) 0 0/22px 22px}
.thumb::after{content:"";position:absolute;inset:auto -20% -45% -20%;height:70%;border-radius:50%;background:rgba(255,255,255,.18)}
.tw:hover .thumb{transform:translateY(-4px) rotate(-1.5deg);box-shadow:0 9px 0 var(--navy)}
.tw:active .thumb{transform:translateY(2px);box-shadow:0 2px 0 var(--navy)}
.emblem{position:relative;z-index:1;width:58%;aspect-ratio:1/1;border-radius:22%;background:#fff;border:3px solid var(--navy);display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(11,42,91,.35);font-family:var(--display);font-weight:800;font-size:42px;color:var(--navy)}
.emblem img{width:58%;height:58%;object-fit:contain;image-rendering:auto}
.emoji{position:absolute;z-index:1;top:8px;left:9px;font-size:20px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.ribbon{position:absolute;z-index:2;top:12px;right:-30px;transform:rotate(40deg);width:110px;text-align:center;font-family:var(--display);font-weight:800;font-size:12px;
  padding:2px 0;background:var(--red);color:#fff;border-top:2px solid var(--navy);border-bottom:2px solid var(--navy)}
.ribbon.ask{background:var(--purple)}
.chk{position:absolute;z-index:3;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--navy);
  display:grid;place-items:center;font-weight:900;color:transparent;font-size:15px}
.chk:hover{color:#b9c7d8}
.tile.done .chk{background:var(--green);color:#fff}
.tile.done .thumb{filter:saturate(.35) brightness(.95)}
.tname{margin-top:10px;text-align:center;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;color:var(--navy)}
.tblurb{margin-top:3px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.twhy{margin-top:5px;text-align:center;font-size:12px;font-weight:800;color:#0e9f5a}
.empty{grid-column:1/-1;text-align:center;padding:26px;color:var(--muted);font-weight:800}

footer{text-align:center;color:var(--muted);font-size:13px;font-weight:700;padding-bottom:30px}
footer a{color:var(--sky2);text-decoration:underline}

@media (max-width:600px){
  .logo{font-size:23px}.logo small{display:none}.sky .wrap{gap:10px}
  .search{order:5;width:100%}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .ptitle{font-size:19px}
  .emblem{font-size:34px}
}
</style>
</head>
<body>
<header>
  <div class="sky"><div class="wrap">
    <a class="logo" href="./" aria-label="Kubaman Arcade">
      <span class="w" id="logoWord"></span><small>daily games</small>
    </a>
    <div class="spacer"></div>
    <input class="search" id="q" type="search" placeholder="🔍 Search games" aria-label="Search games">
    <button class="rnd" id="randomBtn" title="Open a random game you haven't played today">🎲 Random</button>
  </div></div>
  <nav class="cats" aria-label="Categories"><div class="wrap" id="chips"></div></nav>
</header>

<main class="wrap">
  <section class="panel" id="favPanel">
    <div class="ptitle c1">⭐ My Daily Rotation <span class="n" id="todayPill">0/0 today</span></div>
    <div class="pbody">
      <div class="prog"><i id="progBar" style="width:0"></i></div>
      <div class="grid" id="favs"></div>
    </div>
  </section>

  <section class="panel" id="newWrap" hidden>
    <div class="ptitle c2">🆕 New This Week <span class="n" id="newCount"></span></div>
    <div class="pbody">
      <p class="sub">Found by the weekly game scout, picked to match the games above.</p>
      <div class="grid" id="fresh"></div>
    </div>
  </section>

  <section class="panel">
    <div class="ptitle c3"><span id="allTitle">🎮 All Games</span> <span class="n" id="totalPill"></span></div>
    <div class="pbody"><div class="grid" id="all"></div></div>
  </section>

  <footer>Checkmarks reset every day and stay in this browser. List updated <span id="updated">…</span> · <a href="games.json">games.json</a></footer>
</main>

<script>
(() => {
  const TAGS = {all:["🎮","All Games"], top10:["🔟","Top 10 Lists"], rarity:["💎","Rare Answers"], draft:["🏆","Draft & Roster"], sports:["🏀","Sports"],
    geo:["🌍","Geography"], connections:["🧩","Connections"], sporcle:["❓","Sporcle"], estimate:["📏","Estimate & Puzzle"], daily:["📅","Daily"]};
  const PALETTE = [["#ff6b6b","#ff9f43"],["#4dabf7","#3b5bdb"],["#51cf66","#0ca678"],["#fcc419","#ff922b"],["#cc5de8","#7048e8"],["#ff6fb5","#f03e3e"],["#22d3ee","#0891b2"],["#94d82d","#37b24d"]];
  const $ = id => document.getElementById(id);

  $("logoWord").innerHTML = [..."KUBAMAN ARCADE"].map(c => c === " " ? "&nbsp;" : `<span>${c}</span>`).join("");

  const today = new Date().toLocaleDateString("en-CA");
  const KEY = "arcade-played-" + today;
  let played = {};
  try { played = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(played)); } catch (e) {} };

  let games = [], filter = "all", query = "";
  try { const f = localStorage.getItem("arcade-filter"); if (f && TAGS[f]) filter = f; } catch (e) {}

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
  const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const isNew = (g, ref) => g.source !== "seed" && g.added && (ref - new Date(g.added)) / 864e5 <= 7;

  function tile(g, ref) {
    const [a, b] = PALETTE[hash(g.id) % PALETTE.length];
    const letter = esc(g.name[0]);
    const emblem = g.needsLink ? letter
      : `<img alt="" loading="lazy" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host(g.url))}&sz=128" onerror="this.replaceWith(document.createTextNode('${letter}'))">`;
    const tag = (g.tags || []).find(t => t !== "daily") || "daily";
    const ribbon = g.needsLink ? `<span class="ribbon ask">LINK?</span>` : isNew(g, ref) ? `<span class="ribbon">NEW!</span>` : "";
    const href = `href="${esc(g.url)}" target="_blank" rel="noopener" data-play="${esc(g.id)}"`;
    return `<div class="tile${played[g.id] ? " done" : ""}">
      <div class="tw">
        <a ${href} title="${esc(g.blurb)}" aria-label="Play ${esc(g.name)}">
          <div class="thumb" style="background:linear-gradient(135deg,${a},${b})">
            <span class="emoji">${TAGS[tag]?.[0] || "🎮"}</span>${ribbon}
            <div class="emblem">${emblem}</div>
          </div>
        </a>
        <button class="chk" data-chk="${esc(g.id)}" title="Mark as played today" aria-label="Mark ${esc(g.name)} as played today">✓</button>
      </div>
      <a ${href} tabindex="-1">
        <div class="tname">${esc(g.name)}</div>
        <div class="tblurb">${esc(g.blurb)}</div>
        ${g.why ? `<div class="twhy">💡 ${esc(g.why)}</div>` : ""}
      </a>
    </div>`;
  }

  function render() {
    const ref = new Date();
    const favs = games.filter(g => g.favorite);
    $("favs").innerHTML = favs.map(g => tile(g, ref)).join("");
    const n = favs.filter(g => played[g.id]).length;
    $("todayPill").textContent = `${n}/${favs.length} today`;
    $("progBar").style.width = favs.length ? (100 * n / favs.length) + "%" : "0";

    const fresh = games.filter(g => isNew(g, ref));
    $("newWrap").hidden = !fresh.length;
    $("fresh").innerHTML = fresh.map(g => tile(g, ref)).join("");
    $("newCount").textContent = fresh.length;

    const used = new Set(games.flatMap(g => g.tags || []));
    $("chips").innerHTML = Object.keys(TAGS).filter(t => t === "all" || (t !== "daily" && used.has(t)))
      .map(t => `<button class="cat${t === filter ? " on" : ""}" data-tag="${t}">${TAGS[t][0]} ${TAGS[t][1]}</button>`).join("");

    const q = query.toLowerCase();
    const list = games.filter(g => (filter === "all" || (g.tags || []).includes(filter)) &&
      (!q || (g.name + " " + g.blurb + " " + (g.tags || []).join(" ")).toLowerCase().includes(q)));
    $("allTitle").textContent = `${TAGS[filter][0]} ${TAGS[filter][1]}`;
    $("totalPill").textContent = list.length;
    $("all").innerHTML = list.length ? list.map(g => tile(g, ref)).join("") : `<div class="empty">No games match 😢</div>`;
  }

  document.addEventListener("click", e => {
    const chk = e.target.closest("[data-chk]");
    if (chk) { const id = chk.dataset.chk; played[id] ? delete played[id] : (played[id] = 1); save(); render(); return; }
    const play = e.target.closest("[data-play]");
    if (play) { played[play.dataset.play] = 1; save(); setTimeout(render, 50); return; }
    const chip = e.target.closest("[data-tag]");
    if (chip) {
      filter = chip.dataset.tag; try { localStorage.setItem("arcade-filter", filter); } catch (err) {}
      render(); $("all").closest(".panel").scrollIntoView({behavior: "smooth", block: "start"});
    }
  });
  $("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
  $("randomBtn").addEventListener("click", () => {
    const playable = games.filter(g => !g.needsLink);
    const unplayed = playable.filter(g => !played[g.id]);
    const pool = unplayed.length ? unplayed : playable;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    if (!pick) return;
    played[pick.id] = 1; save(); render();
    window.open(pick.url, "_blank", "noopener");
  });

  fetch("games.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
    games = d.games || [];
    $("updated").textContent = d.updated || "?";
    render();
  }).catch(() => { $("all").innerHTML = `<div class="empty">Couldn't load games.json.</div>`; });
})();
</script>
</body>
</html>
