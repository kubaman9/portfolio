<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07040f">
<title>Kubaman Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#07040f; --bg2:#0e0820; --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f3efff; --muted:#a79fc2; --dim:#6d6590;
  --cyan:#22e4ff; --pink:#ff3ec8; --lime:#b6ff3b; --amber:#ffc23d; --violet:#9b6bff; --orange:#ff7a3d;
  --display:"Baloo 2",system-ui,sans-serif; --ol:#0c0620; --hard:0 5px 0 #000;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- background ---------- */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:var(--violet);top:-160px;left:-120px}
.b2{width:460px;height:460px;background:var(--pink);top:30%;right:-180px;animation-delay:-7s;opacity:.22}
.b3{width:420px;height:420px;background:var(--cyan);bottom:-200px;left:25%;animation-delay:-14s;opacity:.18}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.stars{position:absolute;inset:0;background-image:
  radial-gradient(1px 1px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 30% 70%,#fff6,transparent),
  radial-gradient(1.5px 1.5px at 55% 35%,#fff9,transparent),radial-gradient(1px 1px at 75% 15%,#fff6,transparent),
  radial-gradient(1px 1px at 88% 60%,#fff7,transparent),radial-gradient(1.5px 1.5px at 20% 90%,#fff5,transparent),
  radial-gradient(1px 1px at 65% 85%,#fff6,transparent),radial-gradient(1px 1px at 42% 8%,#fff7,transparent);
  background-size:600px 600px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
@media (prefers-reduced-motion:reduce){.blob,.stars,.pulse,.node.next .orb{animation:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(7,4,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;white-space:nowrap;letter-spacing:.5px;
  text-shadow:0 3px 0 #000,2px 3px 0 #000,-2px 3px 0 #000,0 0 22px rgba(255,62,200,.35)}
.logo span{display:inline-block;transition:transform .2s}
.logo:hover span{transform:translateY(-3px) rotate(-5deg)}
.logo span:nth-child(5n+1){color:var(--amber)}
.logo span:nth-child(5n+2){color:var(--cyan)}
.logo span:nth-child(5n+3){color:var(--lime)}
.logo span:nth-child(5n+4){color:var(--pink)}
.logo span:nth-child(5n+5){color:#fff}
.logo i{display:inline-block;width:10px}
.spacer{flex:1}
.search{position:relative;width:260px}
.search input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 14px 10px 38px;color:var(--text);font:inherit}
.search input::placeholder{color:var(--dim)}
.search input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,228,255,.18)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;border-radius:12px;padding:10px 16px;white-space:nowrap;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn-hot{font-family:var(--display);font-size:17px;padding:6px 16px;background:var(--amber);color:#1a0d00;border:3px solid #000;border-radius:999px;box-shadow:var(--hard)}
.btn-hot:hover{transform:translateY(-1px)}
.btn-hot:active,.btn-play:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn-ghost{border:3px solid #000;background:#241a44;border-radius:16px;box-shadow:var(--hard);font-family:var(--display);font-size:17px;padding:8px 18px}
.btn-ghost:hover{border-color:var(--cyan)}

/* ---------- hero ---------- */
.hero{position:relative;margin-top:26px;border-radius:28px;padding:30px;overflow:hidden;border:3px solid #000;box-shadow:0 8px 0 #000,0 0 0 1px rgba(255,255,255,.08) inset;
  background:linear-gradient(120deg,rgba(155,107,255,.28),rgba(255,62,200,.14) 45%,rgba(34,228,255,.12));
  display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 15% 0%,rgba(255,255,255,.12),transparent);pointer-events:none}
.eyebrow{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(182,255,59,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(182,255,59,0)}100%{box-shadow:0 0 0 0 rgba(182,255,59,0)}}
.hero-main{display:flex;align-items:center;gap:22px;margin-top:14px;position:relative;z-index:1}
.hero-ico{width:104px;height:104px;flex:none;border-radius:26px;display:grid;place-items:center;background:#fff;border:4px solid #000;box-shadow:0 0 0 4px rgba(255,255,255,.08),0 18px 50px -10px var(--glow,#ff3ec8);transform:rotate(-4deg)}
.hero-ico img{width:64px;height:64px;object-fit:contain;border-radius:10px}
.hero-ico span{font-family:var(--display);font-size:46px;color:#1a1033}
.hero h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:.95;margin:0 0 8px;text-shadow:0 4px 0 #000,0 0 30px rgba(255,62,200,.35)}
.hero p{margin:0 0 18px;color:var(--muted);font-size:17px;max-width:520px}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-play{font-family:var(--display);font-size:20px;padding:8px 26px;background:var(--lime);color:#0b1400;border:3px solid #000;border-radius:16px;box-shadow:var(--hard),0 10px 30px -8px rgba(182,255,59,.6)}
.btn-play:hover{transform:translateY(-1px)}

.ring{position:relative;width:150px;height:150px;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:rgba(255,255,255,.08)}
.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(182,255,59,.6))}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--display);font-size:34px;line-height:1}
.ring .sm{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:4px}

/* ---------- daily run (level path) ---------- */
.sect{margin-top:44px}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sh h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0;text-shadow:0 3px 0 #000}
.sh .hint{color:var(--dim);font-size:13px;font-weight:600}
.sh .ct{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}

.path{position:relative;display:flex;gap:0;overflow-x:auto;padding:18px 6px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.path::-webkit-scrollbar{display:none}
.node{position:relative;flex:0 0 128px;display:flex;flex-direction:column;align-items:center;text-align:center;scroll-snap-align:center}
.node::before{content:"";position:absolute;top:38px;left:-50%;width:100%;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 8px,transparent 8px 14px);z-index:0}
.node:first-child::before{display:none}
.node.done::before{background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 10px rgba(182,255,59,.5)}
.orb{position:relative;z-index:1;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:4px solid var(--line2);box-shadow:0 5px 0 #000;transition:transform .2s,box-shadow .2s,border-color .2s}
.orb .in{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.orb img{width:34px;height:34px;object-fit:contain}
.orb .in span{font-family:var(--display);font-size:24px;color:#1a1033}
.node a:hover .orb{transform:translateY(-4px) scale(1.05);border-color:var(--cyan);box-shadow:0 0 24px rgba(34,228,255,.45)}
.node.done .orb{border-color:var(--lime);box-shadow:0 0 22px rgba(182,255,59,.45)}
.node.done .orb .in{filter:grayscale(.2)}
.node.next .orb{border-color:var(--pink);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 30px rgba(255,62,200,.75)}}
.num{position:absolute;z-index:2;top:-6px;right:20px;min-width:26px;height:26px;border-radius:13px;padding:0 6px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;background:var(--bg);border:2px solid var(--line2);color:var(--muted)}
.node.done .num{background:var(--lime);border-color:var(--lime);color:#0b1400}
.node.next .num{background:var(--pink);border-color:var(--pink);color:#fff}
.nname{margin-top:10px;font-weight:700;font-size:14px;line-height:1.15;max-width:118px}
.ntag{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;color:var(--dim)}
.node.next .ntag{color:var(--pink)}
.node.done .ntag{color:var(--lime)}
.tog{margin-top:6px;font-size:11px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tog:hover{color:var(--text);border-color:var(--line2)}

/* ---------- shelves ---------- */
.jump{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:40px;padding-bottom:2px}
.jump::-webkit-scrollbar{display:none}
.jump{padding:4px 2px 10px}
.jump a{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:16px;padding:5px 15px;border-radius:999px;border:3px solid #000;background:var(--c,var(--cyan));color:#120a24;box-shadow:0 4px 0 #000;transition:transform .12s,box-shadow .12s}
.jump a:hover{transform:translateY(-2px);box-shadow:0 6px 0 #000,0 0 18px -2px var(--c)}
.jump a:active{transform:translateY(3px);box-shadow:0 1px 0 #000}

.shelf{margin-top:38px;scroll-margin-top:84px}
.shelf .sh h2{color:var(--c);text-shadow:0 3px 0 #000,0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.shelf .sh h2 .e{margin-right:6px}
.row{position:relative}
.track{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:50%;transform:translateY(-60%);z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(14,8,32,.9);border:1px solid var(--line2);display:grid;place-items:center;font-size:18px;opacity:0;transition:opacity .2s}
.row:hover .arrow{opacity:1}
.arrow.l{left:-14px}.arrow.r{right:-14px}
.arrow:hover{border-color:var(--c)}
@media (hover:none){.arrow{display:none}}

.gt{flex:0 0 178px;scroll-snap-align:start;position:relative}
.gt.big{flex-basis:214px}
.tw{position:relative}
.thumb{position:relative;display:grid;place-items:center;aspect-ratio:1/1;border-radius:20px;border:4px solid #000;overflow:hidden;
  box-shadow:0 6px 0 #000;transition:transform .16s,box-shadow .16s}
.thumb::before{content:"";position:absolute;inset:0;opacity:.22;background:radial-gradient(circle,#fff 0 3px,transparent 4px) 0 0/22px 22px}
.thumb::after{content:"";position:absolute;left:-25%;right:-25%;bottom:-48%;height:72%;border-radius:50%;background:rgba(255,255,255,.16)}
.tw:hover .thumb{transform:translateY(-5px) rotate(-2deg);box-shadow:0 11px 0 #000,0 0 30px -4px var(--c)}
.tw:active .thumb{transform:translateY(3px);box-shadow:0 2px 0 #000}
.emblem{position:relative;z-index:1;width:56%;aspect-ratio:1/1;border-radius:24%;background:#fff;border:4px solid #000;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.emblem img{width:60%;height:60%;object-fit:contain}
.emblem span{font-family:var(--display);font-weight:800;font-size:42px;color:#1a1033}
.emoji{position:absolute;z-index:1;top:8px;left:10px;font-size:20px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.ribbon{position:absolute;z-index:2;top:14px;right:-32px;transform:rotate(40deg);width:116px;text-align:center;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.5;
  background:var(--pink);color:#fff;border-top:3px solid #000;border-bottom:3px solid #000}
.ribbon.ask{background:var(--violet)}
.ribbon.fav{background:var(--lime);color:#0b1400}
.ck{position:absolute;z-index:3;right:9px;bottom:9px;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid #000;display:grid;place-items:center;color:transparent;font-weight:900;font-size:15px;box-shadow:0 3px 0 #000}
.ck:hover{color:#b9b3cc}
.gt.done .ck{background:var(--lime);color:#0b1400}
.gt.done .thumb{filter:saturate(.3) brightness(.7)}
.meta{display:block;margin-top:12px;text-align:center}
.tname{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;color:var(--text)}
.tw:hover + .meta .tname,.meta:hover .tname{color:var(--c)}
.tblurb{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.twhy{margin-top:6px;font-size:12px;font-weight:700;color:var(--c);line-height:1.3}
.empty{color:var(--dim);font-weight:600;padding:20px 0}

footer{margin:64px 0 40px;text-align:center;color:var(--dim);font-size:13px}
footer a{color:var(--muted);text-decoration:underline}

@media (max-width:760px){
  .top .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .search{order:5;width:100%}
  .hero{grid-template-columns:1fr;padding:22px;border-radius:22px}
  .hero-main{flex-direction:column;align-items:flex-start;gap:16px}
  .hero-ico{width:84px;height:84px;border-radius:22px}
  .hero-ico img{width:50px;height:50px}
  .ring{position:absolute;top:18px;right:18px;width:92px;height:92px}
  .ring .big{font-size:22px}.ring .sm{font-size:9px}
  .gt{flex-basis:150px}.gt.big{flex-basis:170px}.logo{font-size:22px}.logo i{width:6px}.btn-hot{font-size:15px;padding:4px 12px}.top .spacer{min-width:4px}.hero h1{font-size:40px}
  .sh .hint{display:none}.sh h2{white-space:nowrap;font-size:18px}
  .ring .lbl{transform:scale(.9)}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="stars"></div><div class="scan"></div></div>

<header class="top"><div class="wrap">
  <a class="logo" href="./" id="logo" aria-label="Kubaman Arcade">KUBAMAN ARCADE</a>
  <div class="spacer"></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search games" aria-label="Search games"></label>
  <button class="btn btn-hot" id="randomBtn" title="Open a random game you haven't played today">🎲 Random</button>
</div></header>

<main class="wrap">
  <section class="hero" id="hero" aria-live="polite"></section>

  <section class="sect">
    <div class="sh"><h2>⭐ Daily Run</h2><span class="hint">Clear them all, in any order</span><span class="ct" id="runCt"></span></div>
    <div class="path" id="path"></div>
  </section>

  <nav class="jump" id="jump" aria-label="Jump to a shelf"></nav>
  <div id="shelves"></div>

  <footer>Progress resets every day and stays in this browser · list updated <span id="updated">…</span> · <a href="games.json">games.json</a></footer>
</main>

<script>
(() => {
  const SHELVES = [
    {key:"new",     title:"Fresh Drops",       hint:"New this week from the game scout", c:"var(--pink)"},
    {key:"top10",   title:"Top 10 Lists",      hint:"Name the whole list",               c:"var(--amber)"},
    {key:"rarity",  title:"Rare Answers",      hint:"Obscure is good",                   c:"var(--cyan)"},
    {key:"draft",   title:"Draft & Roster",    hint:"Build a team, go undefeated",       c:"var(--lime)"},
    {key:"geo",     title:"Geography",         hint:"Countries, flags, connections",     c:"#3dffb0"},
    {key:"estimate",title:"Estimate & Puzzle", hint:"Good guesses, clean cuts",          c:"var(--orange)"},
    {key:"sporcle", title:"Sporcle",           hint:"Sports list quizzes",               c:"var(--violet)"},
  ];
  const TAGNAME = {top10:"Top 10", rarity:"Rare answers", draft:"Draft", sports:"Sports", geo:"Geography", connections:"Connections", sporcle:"Sporcle", estimate:"Estimate", daily:"Daily"};
  const $ = id => document.getElementById(id);
  const PALETTE = [["#ff6b6b","#ff9f43"],["#4dabf7","#3b5bdb"],["#51cf66","#0ca678"],["#fcc419","#ff922b"],["#cc5de8","#7048e8"],["#ff6fb5","#f03e3e"],["#22d3ee","#0891b2"],["#94d82d","#37b24d"]];
  const EMOJI = {top10:"🔟", rarity:"💎", draft:"🏆", sports:"🏀", geo:"🌍", connections:"🧩", sporcle:"❓", estimate:"📏", daily:"📅", new:"✨"};
  const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  $("logo").innerHTML = [..."KUBAMAN ARCADE"].map(c => c === " " ? "<i></i>" : `<span>${c}</span>`).join("");
  const today = new Date().toLocaleDateString("en-CA");
  const KEY = "arcade-played-" + today;
  let played = {};
  try { played = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(played)); } catch (e) {} };
  let games = [], query = "", heroSkip = 0;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
  const isNew = g => g.source !== "seed" && g.added && (Date.now() - new Date(g.added)) / 864e5 <= 7;
  const icon = (g, size) => {
    const L = esc(g.name[0]);
    return g.needsLink ? `<span>${L}</span>`
      : `<img alt="" loading="lazy" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host(g.url))}&sz=${size}" onerror="this.outerHTML='<span>${L}</span>'">`;
  };
  const link = g => `href="${esc(g.url)}" target="_blank" rel="noopener" data-play="${esc(g.id)}"`;
  const tagLabel = g => TAGNAME[(g.tags || []).find(t => t !== "daily")] || "Daily";

  function renderHero(favs) {
    const left = favs.filter(g => !played[g.id] && !g.needsLink);
    const done = favs.filter(g => played[g.id]).length, total = favs.length;
    const C = 2 * Math.PI * 62, off = C * (1 - (total ? done / total : 0));
    let pick, eyebrow, sub;
    if (left.length) {
      pick = left[heroSkip % left.length]; eyebrow = "Up next"; sub = pick.blurb;
    } else {
      const bonus = games.filter(g => !g.favorite && !g.needsLink && !played[g.id]);
      pick = bonus.length ? bonus[(new Date().getDate() + heroSkip) % bonus.length] : null;
      eyebrow = "Run complete · bonus round"; sub = pick ? pick.blurb : "You played everything today.";
    }
    $("hero").innerHTML = `
      <div>
        <div class="eyebrow"><span class="pulse"></span>${esc(eyebrow)}</div>
        ${pick ? `<div class="hero-main">
          <div class="hero-ico">${icon(pick, 128)}</div>
          <div><h1>${esc(pick.name)}</h1><p>${esc(sub)}</p>
            <div class="actions">
              <a class="btn btn-play" ${link(pick)}>▶ Play now</a>
              <button class="btn btn-ghost" id="skipBtn">Skip ↻</button>
            </div></div>
        </div>` : `<div class="hero-main"><div><h1>GG 🏆</h1><p>${esc(sub)}</p></div></div>`}
      </div>
      <div class="ring" title="${done} of ${total} played today">
        <svg viewBox="0 0 150 150"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#b6ff3b"/><stop offset="1" stop-color="#22e4ff"/></linearGradient></defs>
          <circle class="trk" cx="75" cy="75" r="62"/><circle class="val" cx="75" cy="75" r="62" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="lbl"><div class="big">${done}/${total}</div><div class="sm">played</div></div>
      </div>`;
  }

  function renderPath(favs) {
    const nextId = (favs.find(g => !played[g.id] && !g.needsLink) || {}).id;
    $("runCt").textContent = `${favs.filter(g => played[g.id]).length} of ${favs.length} cleared`;
    $("path").innerHTML = favs.map((g, i) => {
      const st = played[g.id] ? "done" : g.id === nextId ? "next" : "";
      const tag = st === "done" ? "Cleared" : st === "next" ? "Up next" : g.needsLink ? "Link?" : tagLabel(g);
      return `<div class="node ${st}">
        <a ${link(g)} title="${esc(g.blurb)}"><div class="orb"><div class="in">${icon(g, 64)}</div></div><span class="num">${st === "done" ? "✓" : i + 1}</span></a>
        <div class="nname">${esc(g.name)}</div><div class="ntag">${tag}</div>
        <button class="tog" data-chk="${esc(g.id)}">${played[g.id] ? "undo" : "mark done"}</button>
      </div>`;
    }).join("");
  }

  function card(g, c, big) {
    const [a, b] = PALETTE[hash(g.id) % PALETTE.length];
    const tag = (g.tags || []).find(t => t !== "daily") || "daily";
    const ribbon = g.needsLink ? `<span class="ribbon ask">LINK?</span>` : isNew(g) ? `<span class="ribbon">NEW!</span>` : g.favorite ? `<span class="ribbon fav">DAILY</span>` : "";
    return `<article class="gt${big ? " big" : ""}${played[g.id] ? " done" : ""}" style="--c:${c}">
      <div class="tw">
        <a class="thumb" ${link(g)} style="background:linear-gradient(135deg,${a},${b})" aria-label="Play ${esc(g.name)}" title="${esc(g.blurb)}">
          <span class="emoji">${EMOJI[tag]}</span>${ribbon}<div class="emblem">${icon(g, 128)}</div>
        </a>
        <button class="ck" data-chk="${esc(g.id)}" title="Mark as played today" aria-label="Mark ${esc(g.name)} played">✓</button>
      </div>
      <a class="meta" ${link(g)} tabindex="-1">
        <div class="tname">${esc(g.name)}</div>
        <div class="tblurb">${esc(g.blurb)}</div>
        ${g.why ? `<div class="twhy">💡 ${esc(g.why)}</div>` : ""}
      </a>
    </article>`;
  }

  function row(id, title, hint, c, list, big) {
    return `<section class="shelf" id="s-${id}" style="--c:${c}">
      <div class="sh"><h2>${EMOJI[id] ? `<span class="e">${EMOJI[id]}</span>` : ""}${esc(title)}</h2><span class="hint">${esc(hint)}</span><span class="ct">${list.length}</span></div>
      <div class="row"><button class="arrow l" data-scroll="-1" aria-label="Scroll left">‹</button>
        <div class="track">${list.map(g => card(g, c, big)).join("")}</div>
        <button class="arrow r" data-scroll="1" aria-label="Scroll right">›</button></div>
    </section>`;
  }

  function renderShelves() {
    const q = query.toLowerCase();
    if (q) {
      const hits = games.filter(g => (g.name + " " + g.blurb + " " + (g.tags || []).join(" ") + " " + (g.why || "")).toLowerCase().includes(q));
      $("jump").innerHTML = "";
      $("shelves").innerHTML = hits.length ? row("search", `Results for “${query}”`, "", "var(--cyan)", hits)
        : `<section class="shelf"><p class="empty">No games match “${esc(query)}”.</p></section>`;
      return;
    }
    const built = SHELVES.map(s => ({...s, list: s.key === "new" ? games.filter(isNew)
      : games.filter(g => (g.tags || []).includes(s.key) && (s.key === "sporcle" || !(g.tags || []).includes("sporcle")))}))
      .filter(s => s.list.length);
    $("jump").innerHTML = built.map(s => `<a href="#s-${s.key}" style="--c:${s.c}">${esc(s.title)}</a>`).join("");
    $("shelves").innerHTML = built.map(s => row(s.key, s.title, s.hint, s.c, s.list, s.key === "new")).join("");
  }

  function render() {
    const favs = games.filter(g => g.favorite);
    renderHero(favs); renderPath(favs); renderShelves();
  }

  document.addEventListener("click", e => {
    const chk = e.target.closest("[data-chk]");
    if (chk) { e.preventDefault(); const id = chk.dataset.chk; played[id] ? delete played[id] : (played[id] = 1); save(); render(); return; }
    const play = e.target.closest("[data-play]");
    if (play) { played[play.dataset.play] = 1; save(); setTimeout(render, 60); return; }
    if (e.target.closest("#skipBtn")) { heroSkip++; render(); return; }
    const arr = e.target.closest("[data-scroll]");
    if (arr) { const t = arr.parentElement.querySelector(".track"); t.scrollBy({left: +arr.dataset.scroll * t.clientWidth * .85, behavior: "smooth"}); }
  });
  $("q").addEventListener("input", e => { query = e.target.value.trim(); renderShelves(); });
  $("randomBtn").addEventListener("click", () => {
    const playable = games.filter(g => !g.needsLink);
    const fresh = playable.filter(g => !played[g.id]);
    const pool = fresh.length ? fresh : playable;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    if (!pick) return;
    played[pick.id] = 1; save(); render();
    window.open(pick.url, "_blank", "noopener");
  });

  fetch("games.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
    games = d.games || [];
    $("updated").textContent = d.updated || "?";
    render();
  }).catch(() => { $("hero").innerHTML = `<p>Couldn't load games.json.</p>`; });
})();
</script>
</body>
</html>
