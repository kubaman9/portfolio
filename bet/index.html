<style>
:root{
  color-scheme:dark;
  --bg:#070b10; --bg2:#0b1118; --panel:#0f161f; --panel2:#131c27; --line:#1c2733; --line2:#263443;
  --text:#e8eef5; --muted:#8b98a8; --dim:#5d6b7b;
  --green:#19e68c; --green2:#10b56d; --greenbg:rgba(25,230,140,.12);
  --red:#f25f5c; --redbg:rgba(242,95,92,.13); --yellow:#facc15; --yellowbg:rgba(250,204,21,.12);
  --blue:#60a5fa; --gold:#f5b518; --orange:#ff6a3d; --radius:14px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
b{font-weight:700;color:#fff}
.acc{color:var(--green);font-weight:600}
.pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--yellow)} .mut{color:var(--muted)} .dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0a1017,#070b10);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#1ff29a,#0a9c5b);color:#04130b;font-weight:800;font-size:19px;box-shadow:0 0 22px rgba(25,230,140,.35)}
.brand-name{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand-sub{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c5d0dc;font-weight:500}
.nav a:hover{background:var(--panel)}
.nav a.on{background:var(--greenbg);color:var(--green)}
.nav svg{width:18px;height:18px;flex:none}
.edge{margin-top:auto;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:14px}
.edge .k{font-size:12px;color:var(--muted)}
.edge .v{font-size:22px;font-weight:700;margin:2px 0 0}
.edge .s{font-size:11.5px;color:var(--muted)}
.bot{display:flex;gap:10px;align-items:center;padding:6px}
.bot .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-weight:700;color:var(--green)}
.bot .n{font-weight:600;font-size:12.5px}
.bot .o{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* ---------- main ---------- */
.main{min-width:0;padding:18px 26px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.topbar h1{font-size:15px;font-weight:600;margin:0;color:var(--muted)}
.topbar h1 b{color:var(--text)}
.tb-right{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;color:#c9d4df;white-space:nowrap}
.pill.btn:hover{border-color:var(--green);color:var(--green)}
.pill[aria-disabled=true]{opacity:.35;pointer-events:none}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#2a3a4c,#16212d);display:grid;place-items:center;font-size:12px;border:1px solid var(--line2)}

.grid{display:grid;gap:16px}
.g-today{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.card-h .link{font-size:12px;color:var(--green);font-weight:600;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);padding:26px 26px 22px;min-height:176px;
  background:radial-gradient(120% 140% at 100% 0%,rgba(25,230,140,.22),transparent 55%),radial-gradient(90% 120% at 70% 120%,rgba(96,165,250,.14),transparent 60%),linear-gradient(135deg,#0e1822,#0a1016)}
.hero svg.field{position:absolute;right:-20px;top:0;height:100%;opacity:.5;pointer-events:none}
.hero h2{font-size:32px;line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.025em;position:relative}
.hero h2 span{color:var(--green)}
.hero p{margin:0 0 16px;color:#c3cfdb;max-width:560px;position:relative;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;position:relative;align-items:center}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#03140b;font-weight:700;border-radius:10px;padding:10px 16px;font-size:13.5px}
.cta:hover{filter:brightness(1.08)}
.ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:rgba(15,22,31,.7);border-radius:10px;padding:9px 14px;font-size:13px;color:#c9d4df}
.hero-badge{position:absolute;right:18px;top:18px;background:rgba(7,11,16,.78);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;backdrop-filter:blur(6px)}
.hero-badge .v{font-size:22px;font-weight:800}
.hero-badge .l{font-size:11.5px;color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;color:#c9d4df}
.chip:hover{border-color:#3a4b5e}
.chip.on{background:var(--green);border-color:var(--green);color:#03140b}
.chip .n{font:600 10.5px var(--mono);opacity:.7}

/* sport badge */
.sb{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 10px var(--mono);letter-spacing:.02em;color:#fff;background:var(--c,#334155);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sb.lg{width:64px;height:64px;border-radius:16px;font-size:15px}
.sb.sm{width:26px;height:26px;border-radius:8px;font-size:8.5px}
.sb.xs{width:20px;height:20px;border-radius:6px;font-size:7px}

/* pick rows */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:34px minmax(0,1.35fr) minmax(0,1.35fr) 64px 82px 66px 92px;gap:14px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);border-radius:10px;cursor:pointer}
.prow:first-child{border-top:0}
.prow:hover{background:var(--panel2)}
.prow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--green)}
.prow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .num{font-weight:700;font-family:var(--mono);font-size:13px}
.prow .r{text-align:right}
.phead{display:grid;grid-template-columns:34px minmax(0,1.35fr) minmax(0,1.35fr) 64px 82px 66px 92px;gap:14px;padding:0 8px 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.phead .r{text-align:right}
.status{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.st-win{background:var(--greenbg);color:var(--green)}
.st-loss{background:var(--redbg);color:var(--red)}
.st-push{background:rgba(139,152,168,.15);color:#c3ccd6}
.st-open{background:var(--yellowbg);color:var(--yellow)}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font:700 10.5px var(--mono);background:var(--panel2);border:1px solid var(--line2);color:#c3ccd6;margin-left:6px;vertical-align:1px}
.q.A,.q.B{color:var(--green);border-color:rgba(25,230,140,.4)}
.q.D{color:var(--yellow);border-color:rgba(250,204,21,.35)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}

/* quick stats */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px}
.tile .l{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:3px 0 2px;white-space:nowrap}
.tile .s{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font:500 9.5px var(--mono)}

/* detail */
.detail-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.detail-top h3{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.dboxes{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:8px;margin:14px 0 12px}
.dbox{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2);text-align:center}
.dbox.hi{border-color:rgba(25,230,140,.5);background:var(--greenbg)}
.dbox .v{font-size:19px;font-weight:800;font-family:var(--mono)}
.dbox .l{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 12px;font-size:13px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

/* wire */
.wire{display:flex;flex-direction:column}
.witem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.witem:first-child{border-top:0}
.wk{font:700 9.5px var(--mono);padding:4px 6px;border-radius:6px;background:var(--panel2);color:#c3ccd6;height:fit-content;min-width:38px;text-align:center}
.wk.inj{color:var(--red);background:var(--redbg)} .wk.wx{color:var(--blue);background:rgba(96,165,250,.13)} .wk.mkt{color:var(--green);background:var(--greenbg)} .wk.ros{color:var(--yellow);background:var(--yellowbg)}
.witem .h{font-size:13px;font-weight:500;line-height:1.35}
.witem .m{font-size:11px;color:var(--muted);margin-top:3px}
.note{border-left:3px solid var(--line2);padding:6px 0 6px 11px;margin:0 0 10px}
.note:last-child{margin-bottom:0}
.note.lead{border-color:var(--green)} .note.source{border-color:var(--blue)} .note.exposure{border-color:var(--yellow)}
.note .tg{font:600 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.note .tx{font-size:13px;color:#cdd7e1;margin-top:2px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp.open{-webkit-line-clamp:unset;display:block}

/* parlays */
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.slip{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.slip-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.stype{font:700 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:4px 7px}
.stype.sgp,.stype.prop{background:rgba(168,85,247,.16);color:#c79bff}
.stype.lock,.stype.cross{background:rgba(96,165,250,.14);color:var(--blue)}
.slip .ttl{font-weight:600;line-height:1.35}
.legs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.legs li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#cdd7e1}
.legs li:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:6px}
.sstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sstats div{text-align:center}
.sstats .v{font:700 13px var(--mono)} .sstats .l{font-size:10.5px;color:var(--muted)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:left;padding:0 10px 9px}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--panel2)}
.tbl .r{text-align:right} .tbl .c{text-align:center}
.tbl .ell{max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscroll{overflow-x:auto;margin:0 -6px;padding:0 6px}

/* breakdown */
.brk{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
.donut text{font-family:Inter,sans-serif}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) 58px minmax(60px,1fr) 64px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:7px;border-radius:9px;background:#1a2430;overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--green)}
.track i.neg{background:var(--red)}

/* day list */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dcard{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.dcard:hover{border-color:#34465a}
.dcard .d{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.dcard .h{font-size:12.5px;color:var(--muted)}
.dcard .f{display:flex;flex-wrap:wrap;gap:4px 12px;white-space:nowrap;font:600 12px var(--mono);color:#c3ccd6}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpis .tile .v{font-size:20px}
.kpis .tile .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* details */
details.more{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:0}
details.more>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:after{content:"+";color:var(--muted);font-size:18px}
details.more[open]>summary:after{content:"–"}
details.more>.in{padding:0 16px 16px}
.sec-t{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
.sec-t:first-child{margin-top:0}
.lrow{padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.lrow:first-of-type{border-top:0}
.lrow .t{font-weight:600}
.lrow .b{color:#c3cfdb;margin-top:2px}
.search{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;color:var(--text);font:inherit;font-size:13px;min-width:180px}
.search:focus{outline:none;border-color:var(--green)}
.footer{margin-top:26px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 11px var(--mono);color:var(--dim);letter-spacing:.04em}

/* charts v2 */
.dbars{display:flex;flex-direction:column;gap:12px}
.dbar-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,1.7fr) 76px;gap:12px;align-items:center;font-size:13px}
.dbar-row .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d3dbe4}
.dtrack{position:relative;height:24px;background:var(--bg2);border-radius:6px}
.dtrack:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#2c3a4a}
.dtrack i{position:absolute;top:0;bottom:0;border-radius:5px;background:#4dab8e}
.dtrack i.neg{background:#e06c55}
.dv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.dv b{font:700 13px var(--mono)} .dv span{font-size:11px}
.daybars{width:100%;height:auto;display:block}
.daybars text{fill:var(--dim);font:500 10px var(--mono)}
.daybars a:hover rect{filter:brightness(1.25)}
.qstrip{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.qchip{border:1px solid var(--line2);background:var(--bg2);border-radius:9px;padding:6px 10px;font-size:11.5px;color:var(--muted)}
.qchip b{font:700 13px var(--mono);color:var(--text);margin-right:4px}
.qchip b.pos{color:var(--green)} .qchip b.neg{color:var(--red)}
.calib text{fill:var(--muted);font:500 11px Inter,sans-serif}
.calib .ax{fill:var(--dim);font:500 10px var(--mono)}

/* ledger additions */
.greet h1{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.02em;margin:0}
.greet .gs{font-size:12.5px;color:var(--muted);margin-top:2px}
.gsearch{min-width:0;width:210px}
.kstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:16px;overflow:hidden}
.kstrip>div{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.kstrip>div:first-child{border-left:0}
.kstrip .l{font-size:11.5px;color:var(--muted)}
.kstrip .v{font:700 17px var(--mono);white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.kstrip .s{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:600px;margin-top:14px;position:relative}
.htile{background:rgba(7,11,16,.62);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-width:0}
.htile .l{font-size:11px;color:var(--muted)}
.htile .v{font:700 16px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile .s{font-size:10.5px;color:var(--dim)}
.hero h2 .newb{color:#03140b}
.newb{display:inline-block;vertical-align:middle;margin-left:10px;background:var(--green);color:#03140b;font:800 10.5px var(--mono);border-radius:6px;padding:3px 7px;letter-spacing:.05em;text-transform:uppercase}
.mq{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.mcard{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.mcard:hover{border-color:#34465a}
.mcard.sel{border-color:rgba(25,230,140,.55);box-shadow:0 0 0 1px rgba(25,230,140,.2)}
.mcard .t{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg2{font:600 10.5px var(--mono);border:1px solid var(--line2);border-radius:6px;padding:3px 7px;color:#c3ccd6;text-transform:lowercase;white-space:nowrap}
.tg2.dog{color:var(--gold);border-color:rgba(245,181,24,.45)}
.tg2.open{color:var(--green);border-color:rgba(25,230,140,.45)}
.tg2.win{color:var(--green);border-color:rgba(25,230,140,.45);background:var(--greenbg)}
.tg2.loss{color:var(--red);border-color:rgba(242,95,92,.45);background:var(--redbg)}
.tg2.src{color:var(--blue);border-color:rgba(96,165,250,.4)}
.tg2.mq{color:var(--gold);background:var(--yellowbg);border-color:rgba(245,181,24,.45)}
.meter{height:5px;border-radius:9px;background:#1a2430;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd54a);border-radius:9px}
.meter.thin{height:4px;margin-top:5px;max-width:74px;position:relative;overflow:visible}
.meter.thin b{position:absolute;top:-3px;width:2px;height:10px;background:#e8eef5;border-radius:1px;box-shadow:0 0 0 1px #070b10}
.mrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.quote{border-left:3px solid var(--gold);padding:4px 0 4px 14px;font-style:italic;font-size:15px;color:#dbe3ec;line-height:1.5}
.quote .by{font-style:normal;color:var(--muted);font-size:12px;margin-top:8px}
.lg-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.lg-row:first-of-type{border-top:0}
.lg-row .mono{font-size:12.5px;font-weight:700;text-align:right;min-width:58px}
.me .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--mono);color:var(--gold);border:2px solid var(--gold);background:#12171f}
.user .av{border:2px solid var(--gold);color:var(--gold);font-family:var(--mono);font-weight:800}
.mgreet{display:none}
.tiles4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* mobile nav */
.mnav{display:none}
.mtop{display:none}

@media (max-width:1180px){
  .g-today{grid-template-columns:minmax(0,1fr)}
  .aside{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .aside>.card{min-width:0}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
  .topbar{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
  .mtop .brand{padding:0}
  .aside{grid-template-columns:minmax(0,1fr)}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(9,14,20,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .mnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600;padding:4px 0}
  .mnav a.on{color:var(--green)}
  .mnav svg{width:21px;height:21px}
  .hero{padding:20px 18px 18px;min-height:0}
  .hero h2{font-size:25px}
  .hero-badge{position:static;display:inline-block;margin-top:14px}
  .phead{display:none}
  .prow{grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"b m st" "b p p" "b n n";gap:4px 12px;padding:12px 6px}
  .prow>.c-b{grid-area:b;align-self:start}
  .prow>.c-m{grid-area:m}
  .prow>.c-p{grid-area:p}
  .prow>.c-st{grid-area:st}
  .prow>.c-o,.prow>.c-c,.prow>.c-e{display:none}
  .prow>.c-n{grid-area:n;display:flex;gap:14px;font:600 12px var(--mono);color:#c3ccd6}
  .dboxes{grid-template-columns:1fr 1fr}
  .kstrip{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(122px,1fr);overflow-x:auto}
  .htiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mgreet{display:block;margin:0 0 12px}
  .mgreet h1{font-size:21px}
  .mnav a{font-size:10px}
  .dbar-row{grid-template-columns:minmax(0,1.2fr) minmax(64px,1.1fr) 70px;gap:8px}
  .brk{grid-template-columns:minmax(0,1fr);justify-items:center}
  .brk .bars{width:100%}
  .sstats{grid-template-columns:repeat(2,1fr)}
  .tbl .hide-m{display:none}
  .tbl .ell{max-width:180px}
  .bar-row{grid-template-columns:minmax(0,1fr) 50px minmax(40px,.8fr) 58px}
}
@media (min-width:901px){ .prow>.c-n{display:none} }
</style>

  all.forEach(function(r){ if (!graded(r)) return; var d = r.day; by[d] = by[d] || { date: d, units_day: 0, n: 0, W: 0, L: 0 }; by[d].units_day += num(r.p.units) || 0; by[d].n++; if (String(r.p.result).toUpperCase() === "WIN") by[d].W++; else if (String(r.p.result).toUpperCase() === "LOSS") by[d].L++; });
  var days = Object.keys(by).sort().map(function(d){ var x = by[d]; x.record_after = x.W + "-" + x.L + " slips"; x.picks = x.n; return x; });
  if (!days.length) return "";
  return '<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Parlay units by day</h2><span class="sub">slips only · each bar opens that day</span></div>' + dayBars(days, { h: 170 }) + "</div>";
}
function renderParlays(){
  topbar("<b>Parlay corner</b>", '<a class="pill btn" href="#/today">Today’s card</a>');
  var today = (DAYS[LATEST].slips || []).map(function(s){ return resolve(s, LATEST); });
  var all = ROWS.filter(function(r){ return r.kind === "slip"; }).sort(function(a, b){ return a.day < b.day ? 1 : -1; });
  var by = {}; all.forEach(function(r){ var t = slipType(r.p)[1]; (by[t] = by[t] || []).push(r); });
  var t = tally(all);
  document.getElementById("view").innerHTML =
    parlayDayBars(all) +
    '<div class="card"><div class="card-h"><h2>Today’s slips</h2><span class="sub">' + esc(fD(LATEST, true)) + "</span></div>" + (today.length ? '<div class="slips">' + today.map(slipCard).join("") + "</div>" : '<div class="empty">No parlays on today’s card.</div>') + "</div>" +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));margin-top:16px;align-items:start">' +
    '<div class="card"><div class="card-h"><h2>Parlay record</h2><span class="mono" style="font-weight:700">' + t.W + "–" + t.L + ' · <span class="' + cls(t.u) + '">' + fU(t.u) + "</span></span></div>" + bars(Object.keys(by).map(function(k){ var x = tally(by[k]); return { k: k, W: x.W, L: x.L, u: x.u }; })) + '<div class="sub" style="margin-top:12px">Hit rate ' + (t.wr != null ? t.wr.toFixed(1) + "%" : "—") + " · ROI " + fP(t.roi) + "</div></div>" +
    breakdown("pbrk", [["structure", "Structure"], ["type", "By type"]]) + "</div>" +
    '<div class="card" style="margin-top:16px"><div class="card-h"><h2>Every slip</h2><span class="sub">' + all.length + '</span></div><div class="tscroll"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Slip</th><th class="r hide-m">Price</th><th class="r hide-m">EV</th><th class="r">Result</th></tr></thead><tbody>' +
    all.map(function(r){ var p = r.p, st = slipType(p); return '<tr class="click" data-go="#/day/' + r.day + '"><td class="mono" style="white-space:nowrap">' + fDs(r.day) + '</td><td><span class="stype ' + st[0] + '">' + st[1] + '</span></td><td class="ell">' + esc(plain(p.shape)) + '</td><td class="r mono hide-m">' + esc(plain(p.price || "").replace(/\s*naive/i, "")) + '</td><td class="r mono hide-m ' + cls(p.ev_pct) + '">' + fP(p.ev_pct) + '</td><td class="r">' + stat(p.result, p.units) + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
}

    f.map(function(x){ return '<div class="lrow" style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center"><span class="tg2 ' + (tone[x.flag] || "") + '">' + esc(x.flag) + '</span><div style="min-width:0"><div class="t">' + esc(({ conf_band: "Confidence ", slip_type: "Slips: ", structure: "All " }[String(x.segment).split(":")[0]] || "") + String(x.segment).replace(/^[a-z_]+:/, "").replace("/", " · ")) + ' <span class="mono mut" style="font-weight:500">' + esc(x.record) + '</span></div><div class="sub">' + esc(x.why) + (x.flag === "tighten" ? " → singles sized to 0.25u unless A/B anchor, +2.5% EV and a sourced thesis" : "") + '</div></div><span class="mono ' + cls(x.units) + '" style="font-weight:700">' + fU(x.units) + "</span></div>"; }).join("") + "</div>";

function modelVsMarket(){
  var at = LEDGER && LEDGER.adjustment_test, all = at && at.all;

  var verdict = function(x){ return x.brier_model < x.brier_anchor ? '<span class="tg2 win">helped</span>' : x.brier_model > x.brier_anchor ? '<span class="tg2 loss">hurt</span>' : '<span class="tg2">even</span>'; };

    '<div class="tile"><div class="l">Calibration</div><div class="v" style="font-size:17px;white-space:normal">' + (cal.stated_mean != null ? cal.stated_mean + "% → " + cal.hit_rate + "%" : "—") + '</div><div class="s">stated confidence → actual hit rate (n=' + esc(cal.n) + ")</div></div></div>" +
    (rows.length ? '<table class="tbl"><thead><tr><th>Sport</th><th class="r">n</th><th class="r">Market</th><th class="r">Model</th><th class="r hide-m">Adj.</th><th class="r">Verdict</th></tr></thead><tbody>' + rows.map(function(r){ return '<tr><td><span style="display:inline-flex;gap:8px;align-items:center;white-space:nowrap">' + badge(r.k, "sm") + esc(r.k) + '</span></td><td class="r mono">' + r.x.n + '</td><td class="r mono">' + r.x.brier_anchor.toFixed(3) + '</td><td class="r mono">' + r.x.brier_model.toFixed(3) + '</td><td class="r mono hide-m">' + (r.x.mean_adjustment_pts > 0 ? "+" : "") + r.x.mean_adjustment_pts + '</td><td class="r">' + verdict(r.x) + "</td></tr>"; }).join("") + "</tbody></table>" : "") +

function qualityBlock(){
  var q = LEDGER && LEDGER.quality;
  if (!q || !q.checked) return "";
  var m = q.missing || [];
  return '<div class="sec-t">Data quality · last 3 days</div>' + (m.length ? '<div class="prose"><p class="mut">' + m.length + " of " + q.checked + " picks are missing required fields (the next run fills them):</p></div>" + m.slice(0, 8).map(function(x){ return '<div class="lrow"><div class="t">' + esc(plain(x.bet)) + ' <span class="sub">' + esc(fDs(x.date)) + '</span></div><div class="b sub">missing: ' + esc((x.fields || []).join(", ")) + "</div></div>"; }).join("") : '<div class="prose"><p>All ' + q.checked + " recent picks carry every required field.</p></div>");
}
function renderRisk(){
  topbar("<b>Risk</b>", '<span class="pill mono">8u daily ceiling</span>');
  var d = DAYS[LATEST] || {}, open = ROWS.filter(function(r){ return isOpen(r.p); });
  var risk = 0, games = {}; open.forEach(function(r){ var s = stake(r.p); risk += s; var g = r.kind === "slip" ? "Parlay · " + first(r.p.shape, 44) : plain(r.p.matchup) || "Other"; games[g] = games[g] || { n: 0, u: 0, sport: r.p.sport, stale: false }; games[g].n++; games[g].u += s; if (r.day < LATEST) games[g].stale = true; });
  var today = 0; ((d.picks || []).concat(d.slips || [])).forEach(function(p){ today += num(p.stake_units) || 0; });
  var stale = open.filter(function(r){ return r.day < LATEST; });
  var g = Object.keys(games).sort(function(a, b){ return games[b].u - games[a].u; });
  var ex = d.exposure || {};
  var pctUsed = Math.min(100, Math.round(100 * today / 8));
  document.getElementById("view").innerHTML =
    '<div class="tiles4">' +
    '<div class="tile"><div class="l">Open tickets</div><div class="v neu">' + open.length + '</div><div class="s">' + open.filter(function(r){ return r.kind === "pick"; }).length + " singles · " + open.filter(function(r){ return r.kind === "slip"; }).length + " slips</div></div>" +
    '<div class="tile"><div class="l">Units at risk</div><div class="v">' + (Math.round(risk * 100) / 100) + 'u</div><div class="s">across ' + g.length + " games</div></div>" +
    '<div class="tile"><div class="l">Today vs ceiling</div><div class="v">' + (Math.round(today * 100) / 100) + ' / 8u</div><div class="meter" style="margin-top:6px"><i style="width:' + pctUsed + '%"></i></div></div>' +
    '<div class="tile"><div class="l">Largest single game</div><div class="v">' + (g.length ? (Math.round(games[g[0]].u * 100) / 100) + "u" : "—") + '</div><div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(g[0] ? shortM(g[0]) : "") + "</div></div></div>" +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));margin-top:16px;align-items:start">' +
    '<div class="card"><div class="card-h"><h2>Exposure by game</h2><span class="sub">open tickets only</span></div>' + (g.length ? '<table class="tbl"><thead><tr><th></th><th>Game</th><th class="r">Tickets</th><th class="r">At risk</th></tr></thead><tbody>' + g.map(function(k){ var x = games[k]; return "<tr><td>" + badge(x.sport || "Multi", "sm") + '</td><td class="ell">' + esc(k.indexOf("Parlay · ") === 0 ? k : shortM(k)) + (x.stale ? ' <span class="tg2 dog">older</span>' : "") + '</td><td class="r mono">' + x.n + '</td><td class="r mono">' + (Math.round(x.u * 100) / 100) + "u</td></tr>"; }).join("") + "</tbody></table>" : '<div class="empty">Nothing open.</div>') + "</div>" +
    '<div class="card"><div class="card-h"><h2>Today’s exposure read</h2><span class="sub">' + esc(fD(LATEST)) + "</span></div>" + (ex.sub || ex.note ? '<div class="prose">' + (ex.sub ? "<p>" + md(ex.sub) + "</p>" : "") + (ex.note ? '<p class="mut">' + md(ex.note) + "</p>" : "") + "</div>" : '<div class="empty">No exposure note this run.</div>') +
    (d.alerts || []).filter(function(a){ return a.tone === "exposure"; }).map(function(n){ return '<div class="note exposure"><div class="tg">' + esc(plain(n.tag)) + '</div><div class="tx">' + md(n.text) + "</div></div>"; }).join("") +
    qualityBlock() +
    (stale.length ? '<div class="sec-t">Still open from earlier days</div><div class="prose"><p class="mut">' + stale.length + " ticket" + (stale.length === 1 ? "" : "s") + " logged before today have no grade yet: " + esc(stale.slice(0, 6).map(function(r){ return plain(r.p.bet || r.p.shape); }).join(", ")) + (stale.length > 6 ? "…" : "") + "</p></div>" : "") + "</div></div>";

/* ---------- router + events ---------- */
function render(){
  var r = route();
  safe(function(){ renderSide(r); });
  var ok = safe(function(){ if (r.v === "history") renderHistory(); else if (r.v === "parlays") renderParlays(); else if (r.v === "performance") renderPerformance(); else if (r.v === "clv") renderClv(); else if (r.v === "risk") renderRisk(); else renderDay(r); return true; }, false);
  if (!ok) document.getElementById("view").innerHTML = '<div class="card"><div class="empty">This view hit a data problem. Try <a class="acc" href="#/history">History</a>.</div></div>';
}
var lastRoute = "";
window.addEventListener("hashchange", function(){ var h = location.hash; if (h === "#picks") return; if (h !== lastRoute) { state.sel = 0; state.tab = "analysis"; state.sport = "All"; state.wire = "All"; } lastRoute = h; render(); window.scrollTo(0, 0); });
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-i],[data-tab],[data-sport],[data-brk],[data-h],[data-go],[data-wire],[data-scroll],#more,[data-clamp]");
  if (!t) return;
  if (t.hasAttribute("data-scroll")) { e.preventDefault(); var el = document.getElementById(t.getAttribute("data-scroll")); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.hasAttribute("data-clamp")) { t.classList.toggle("open"); return; }
  if (t.hasAttribute("data-i")) { state.sel = +t.getAttribute("data-i"); state.tab = "analysis"; render(); if (window.innerWidth < 1181) { var dt = document.getElementById("detail"); if (dt) dt.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
  if (t.hasAttribute("data-tab")) { state.tab = t.getAttribute("data-tab"); render(); return; }
  if (t.hasAttribute("data-sport")) { state.sport = t.getAttribute("data-sport"); render(); return; }
  if (t.hasAttribute("data-wire")) { state.wire = t.getAttribute("data-wire"); render(); return; }
  if (t.hasAttribute("data-brk")) { state[t.getAttribute("data-bk")] = t.getAttribute("data-brk"); render(); return; }
  if (t.hasAttribute("data-h")) { state[t.getAttribute("data-h")] = t.getAttribute("data-v"); state.hn = 40; render(); return; }
  if (t.id === "more") { state.hn += 60; render(); return; }
  if (t.hasAttribute("data-go")) { location.hash = t.getAttribute("data-go"); }
});
