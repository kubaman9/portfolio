name: Build betting dashboard from Mongo

# The daily Claude run writes dashboard_days / dashboard_index to Mongo and
# stops there -- it never needs git access to this repo. This workflow reads
# Mongo on a schedule, rebuilds the encrypted bet/index.html, and publishes it
# only when the content hash changed (so most runs exit in ~20s with no commit).
#
# Needs ONE repo secret: MONGODB_URI (read-only user on betting_agent).
# The page passphrase is read from betting_agent.site_config.page_passphrase,
# or from a BET_PAGE_PASSPHRASE secret if you add one.

# ONE PUBLISH A MORNING (Jakub's call): the site changes once a day, after the 3am ET
# daily run has finished the card, not every few minutes. Scheduled runs start from
# ~3:40am ET (several tries, because GitHub delays and drops scheduled runs), wait until
# Mongo shows today's daily run "completed" (or 7:30am ET at the latest), publish once,
# and exit. Later tries that day find nothing changed and exit in seconds. Overnight
# grades are in by then (the ledger pipeline grades until 3:20am ET), so the morning
# page carries yesterday's results and today's card together.
# Manual runs (workflow_dispatch) and pushes to the template publish immediately.
on:
  schedule:
    - cron: "41,53 7 * * *"         # 3:41, 3:53am EDT
    - cron: "11,29,47 8 * * *"      # 4:11-4:47am EDT (3:11-3:47am EST: they wait)
    - cron: "13,37 9 * * *"         # late tries if GitHub dropped the earlier ones
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/bet/**"
      - ".github/workflows/build-bet.yml"

permissions:
  contents: write

concurrency:
  group: publish-bet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Skip cleanly if the Mongo secret is not configured yet
        id: guard
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::warning::MONGODB_URI secret not set -- add it under Settings > Secrets and variables > Actions"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install build deps
        if: steps.guard.outputs.go == 'true'
        run: pip install -q pymongo pycryptodome

      - name: Check out gh-pages alongside
        if: steps.guard.outputs.go == 'true'
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add ../ghpages gh-pages

      - name: Build and publish (once a morning, after the daily run finishes)
        if: steps.guard.outputs.go == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BET_PAGE_PASSPHRASE: ${{ secrets.BET_PAGE_PASSPHRASE }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          build_and_publish() {
            out=$(python3 tools/bet/build_from_mongo.py --out /tmp/bet/index.html --existing ../ghpages/bet/index.html --template-file tools/bet/template.html)
            echo "$out"
            [ "$(printf '%s\n' "$out" | tail -n1)" = "unchanged" ] && return 0
            stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            mkdir -p ../ghpages/bet
            cp /tmp/bet/index.html ../ghpages/bet/index.html
            (cd ../ghpages && git add bet/index.html && git commit -qm "bet: dashboard rebuilt from Mongo ($stamp)" && git pull -q --rebase origin gh-pages && git push -q origin gh-pages)
            mkdir -p public/bet
            cp /tmp/bet/index.html public/bet/index.html
            git add public/bet/index.html
            git commit -qm "bet: mirror dashboard into public/bet ($stamp)"
            git pull --rebase -q origin main
            git push -q origin main
            echo "published $stamp"
          }

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # already published this morning (after 3am ET)? then this is a duplicate try: stop.
            built=$(grep -o 'bet-build" content="[^"]*"' ../ghpages/bet/index.html | sed 's/.*content="//; s/"//' || true)
            if [ -n "$built" ]; then
              built_et=$(TZ=America/New_York date -d "$built" +%F%H)
              today=$(TZ=America/New_York date +%F)
              if [ "${built_et:0:10}" = "$today" ] && [ "${built_et:10:2}" -ge 3 ]; then
                echo "already published this morning ($built UTC); nothing to do"
                exit 0
              fi
            fi
            python3 tools/bet/wait_for_daily_run.py --until-et 07:30
          fi
          build_and_publish
