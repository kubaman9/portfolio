name: Build betting dashboard from Mongo

# The daily Claude run writes dashboard_days / dashboard_index to Mongo and
# stops there -- it never needs git access to this repo. This workflow reads
# Mongo on a schedule, rebuilds the encrypted bet/index.html, and publishes it
# only when the content hash changed (so most runs exit in ~20s with no commit).
#
# Needs ONE repo secret: MONGODB_URI (read-only user on betting_agent).
# The page passphrase is read from betting_agent.site_config.page_passphrase,
# or from a BET_PAGE_PASSPHRASE secret if you add one.

# ONE PUBLISH A DAY (Jakub's call): the site changes once, after the 3am ET daily run
# has finished the card, not every few minutes. GitHub delays and silently drops
# scheduled runs (on 10/4 it dropped all seven morning tries), so there are two kinds
# of chances to publish, and the first one that finds the card ready wins:
#  - the early-morning schedules below wait (up to 7:30am ET) for the daily run;
#  - every ledger-pipeline run (~every 26 min) triggers a quick check that publishes
#    only if today's run has finished and the page has not been published today.
# Once the page is published that day every later try exits in seconds, so the site
# still changes once a day. Manual runs and template pushes publish immediately.
on:
  schedule:
    - cron: "41,53 7 * * *"         # 3:41, 3:53am EDT
    - cron: "11,29,47 8 * * *"      # 4:11-4:47am EDT (3:11-3:47am EST: they wait)
    - cron: "13,37 9 * * *"         # late tries if GitHub dropped the earlier ones
  workflow_run:
    workflows: ["Ledger pipeline (grading, CLV, audit, summary)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/bet/**"
      - ".github/workflows/build-bet.yml"

permissions:
  contents: write

concurrency:
  group: publish-bet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Skip cleanly if the Mongo secret is not configured yet
        id: guard
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::warning::MONGODB_URI secret not set -- add it under Settings > Secrets and variables > Actions"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install build deps
        if: steps.guard.outputs.go == 'true'
        run: pip install -q pymongo pycryptodome

      - name: Check out gh-pages alongside
        if: steps.guard.outputs.go == 'true'
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add ../ghpages gh-pages

      - name: Build and publish (once a day, after the daily run finishes)
        if: steps.guard.outputs.go == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BET_PAGE_PASSPHRASE: ${{ secrets.BET_PAGE_PASSPHRASE }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          build_and_publish() {
            out=$(python3 tools/bet/build_from_mongo.py --out /tmp/bet/index.html --existing ../ghpages/bet/index.html --template-file tools/bet/template.html)
            echo "$out"
            [ "$(printf '%s\n' "$out" | tail -n1)" = "unchanged" ] && return 0
            stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            mkdir -p ../ghpages/bet
            cp /tmp/bet/index.html ../ghpages/bet/index.html
            (cd ../ghpages && git add bet/index.html && git commit -qm "bet: dashboard rebuilt from Mongo ($stamp)" && git pull -q --rebase origin gh-pages && git push -q origin gh-pages)
            mkdir -p public/bet
            cp /tmp/bet/index.html public/bet/index.html
            git add public/bet/index.html
            git commit -qm "bet: mirror dashboard into public/bet ($stamp)"
            git pull --rebase -q origin main
            git push -q origin main
            echo "published $stamp"
          }

          event="${{ github.event_name }}"
          if [ "$event" = "schedule" ] || [ "$event" = "workflow_run" ]; then
            # already published today (after 3am ET)? then this is a duplicate try: stop.
            built=$(grep -o 'bet-build" content="[^"]*"' ../ghpages/bet/index.html | sed 's/.*content="//; s/"//' || true)
            if [ -n "$built" ]; then
              built_et=$(TZ=America/New_York date -d "$built" +%F%H)
              today=$(TZ=America/New_York date +%F)
              if [ "${built_et:0:10}" = "$today" ] && [ "${built_et:10:2}" -ge 3 ]; then
                echo "already published this morning ($built UTC); nothing to do"
                exit 0
              fi
            fi
            if [ "$event" = "workflow_run" ]; then
              python3 tools/bet/wait_for_daily_run.py --until-et 07:30 --check || { echo "not ready; a later run will publish"; exit 0; }
            else
              python3 tools/bet/wait_for_daily_run.py --until-et 07:30
            fi
          fi
          build_and_publish
